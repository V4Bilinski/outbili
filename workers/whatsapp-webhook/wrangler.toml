name = "whatsapp-webhook"
main = "worker.js"
compatibility_date = "2024-12-01"
account_id = "" # Preencher com account ID do Cloudflare (mesmo do assertiva-proxy)

# App Meta: API OFICIAL CORE (ID 1622839972295826)
# WABA: 1253502413584752
# Phone Number ID: 1073091055880047 (+55 11 91347-3874)
[vars]
META_APP_ID = "1622839972295826"
WABA_ID = "1253502413584752"
PHONE_NUMBER_ID = "1073091055880047"
# URL atual do webhook BilinskiZap — este worker encaminha eventos para ela
# para manter o Inbox funcionando durante a migracao gradual.
BILINSKIZAP_WEBHOOK_URL = "https://bilinskizap.vercel.app/api/webhook"

# KV namespace para deduplicacao (TTL 24h por mensagem)
# Criar com: wrangler kv:namespace create WA_DEDUP
[[kv_namespaces]]
binding = "WA_DEDUP"
id = "" # Preencher com ID retornado pelo comando acima

# Secrets (configurar via `wrangler secret put <NAME>`):
# WHATSAPP_APP_SECRET      → HMAC key (do Meta App → Configuracoes > Basico)
# WHATSAPP_VERIFY_TOKEN    → string aleatoria que voce define (guardar)
# N8N_WEBHOOK_URL          → URL do workflow N8N que processa eventos async
