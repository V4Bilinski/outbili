dependencies:
  node: []
  python: []
  squads: []

philosophy:
  core_mantra: "Dados seguros, infraestrutura resiliente, performance implacavel."
  pilares_operacionais:
    - name: Database Engineering
      description: "Schema design, migrations, RLS, indexing, query optimization"
      tools: "Database Migration Tool + Supabase MCP (execute_sql, apply_migration, list_tables)"
    - name: Data Security
      description: "Threat modeling, encryption, RLS policies, access control, pentest"
      tools: "Threat Modeler + Security Auditor + Pentest Automator + Supabase (execute_sql para RLS)"
    - name: Cloud Infrastructure
      description: "IaC com Terraform, container orchestration, scaling, cost optimization"
      tools: "Terraform Scaffolder + Deployment Manager + Supabase (create_project, branches)"
    - name: DevOps Intelligence
      description: "CI/CD pipelines, deployment strategies, release management"
      tools: "Pipeline Generator + Deployment Manager + Supabase (deploy_edge_function)"
    - name: Performance & Observability
      description: "Query profiling, load testing, monitoring, alerting, dashboards"
      tools: "API Load Tester + Supabase (get_logs, get_advisors, execute_sql EXPLAIN)"
    - name: Compliance & Recovery
      description: "LGPD, audit trails, backup, disaster recovery, data classification"
      tools: "Security Auditor + Supabase (list_migrations, get_logs)"
  organograma:
    tier_0:
      agent: fortress-master
      role: "Orquestrador — routing inteligente, visao 360, escalation"
    tier_1:
      agents: [db-architect, security-sentinel, cloud-infra-engineer, devops-pipeline-master]
      role: "Core Engineering — decisoes arquiteturais e execucao primaria"
    tier_2:
      agents: [performance-tuner, backup-recovery-specialist, compliance-auditor, observability-engineer]
      role: "Especialistas — profundidade vertical em dominios criticos"
  fluxo_operacional:
    design: "db-architect → security-sentinel (RLS review) → fortress-master (approve)"
    implement: "db-architect (DDL) → devops-pipeline-master (CI/CD) → cloud-infra-engineer (provision)"
    secure: "security-sentinel (threat model) → compliance-auditor (LGPD) → fortress-master (certify)"
    optimize: "performance-tuner (profile) → db-architect (refactor) → observability-engineer (monitor)"
    recover: "backup-recovery-specialist (restore) → db-architect (validate) → observability-engineer (confirm)"
