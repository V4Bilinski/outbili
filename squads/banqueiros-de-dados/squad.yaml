name: banqueiros-de-dados
version: 1.0.0
description: |
  Squad de Inteligencia de Infraestrutura, Seguranca de Dados & Database Engineering.
  Especializado no ciclo completo de gestao de dados e infraestrutura cloud:
  Design → Provisioning → Security → Optimization → Monitoring → Compliance → Disaster Recovery.

  Organiza 38 capabilities (9 skills + 29 Supabase MCP tools) em 9 agentes especializados
  com workflows operacionais, checklists de validacao e tasks executaveis.

  Fontes de inteligencia:
  - /senior-security: Threat Modeler, Security Auditor, Pentest Automator
  - /senior-devops: Pipeline Generator, Terraform Scaffolder, Deployment Manager
  - /senior-backend: API Scaffolder, Database Migration Tool, API Load Tester
  - Supabase MCP: 29 tools (SQL, migrations, branches, edge functions, logs, types)

  Missao: Garantir que toda infraestrutura, banco de dados e seguranca do Brabissimo
  operem com excelencia, resiliencia e conformidade — do schema ao deploy.

author: Luiz Henrique
license: MIT
slashPrefix: banqueiros

