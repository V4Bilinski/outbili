name: fabrica-de-receita
version: 2.0.0
description: |
  Squad V4 Company de Growth, Performance e Revenue. 4 Pilares, 8 Travas
  oficiais (Cegueira/Exposicao/Atencao/Interesse/Qualificacao/Compromisso/
  Decisao/Retencao), STEP, ciclos 90d, TOC. Produtos DR-X/O/T/E. Governanca:
  documento-mae FABRICA-DE-RECEITA.md, binding agent-to-task obrigatorio,
  Fabio como quality gate gerencial. Ver documento-mae para detalhes.

author: Luiz Henrique
license: MIT
slashPrefix: fdr

aiox:
  minVersion: "2.1.0"
  type: squad

tags:
  - growth
  - receita
  - v4-company
  - toc
  - travas
  - destrava-receita
  - funil
  - trafego
  - retencao
  - ltv
  - spiced
  - ciclo-90-dias
  - step-framework
  - roi
  - revenue-ops

components:
  # IMPORTANTE: documento-mae FABRICA-DE-RECEITA.md e a referencia unica do squad.
  # Qualquer alteracao nesta secao DEVE atualizar FABRICA-DE-RECEITA.md primeiro.
  # v2.0.0 (Fase 2): reducao 20→16 agents concluida.
  #   - Merge: Ancora + Atlas → retention-master.md
  #   - Absorve: Fluxo → orchestrator.md (Nexus passa a ser triage + integrador aquisicao)
  #   - Virou task: Dara → tasks/dr-pitch.md (owned por Apex)
  #   - Virou task: Executor → tasks/dr-pop-create.md (owned por Apex)
  agents:
    # ─── CAMADA 1 — STRATEGIC (3) ───────────────────────
    - fabrica-de-receita-master.md      # Fabio — master V4 + quality gate
    - growth-strategist.md              # Vitor — OKRs, GTM
    - growth-planner.md                 # Gabi — ciclos 90d
    # ─── CAMADA 2 — TRIAGE & DIAGNOSTICO (3) ────────────
    - orchestrator.md                   # Nexus — triage + integrador aquisicao
    - diagnosticador.md                 # Logica — TOC, CRT, 5FS
    - especialista-spiced.md            # Diagnosta — SPICED
    # ─── CAMADA 3 — ESTRATEGIA DE RECEITA (1) ───────────
    - estrategista-receita.md           # Arquiteto — ICP, pricing, forecast
    # ─── CAMADA 4 — EXECUCAO POR PILAR (6) ──────────────
    # Aquisicao (Cegueira → Qualificacao)
    - traffic-hunter.md                 # Hunter — paid + organic
    - content-engine.md                 # Nova — content + nurture
    - conversion-optimizer.md           # Zara — CRO + A/B
    - ai-marketing-engineer.md          # Aria — MarTech + automacoes
    # Comercial (Compromisso → Decisao)
    - maquina-comercial.md              # Fechador — playbooks comerciais
    # Retencao (Retencao)
    - retention-master.md               # Atlas — health + LTV + churn + NPS (merge)
    # ─── CAMADA 5 — SUPORTE TRANSVERSAL (2) ─────────────
    - roi-analyst.md                    # Data — ROI, attribution, BI
    - revenue-team-architect.md         # Rian — org design, RevOps
    # ─── LINHA DE NEGOCIO DR (1) ────────────────────────
    - dr-chief.md                       # Apex — DR-X/O/T/E + pitch + POPs

  tasks:
    - diagnostico-travas.md
    - growth-audit.md
    - ciclo-90-dias.md
    - construir-oferta-dr.md
    - qualificar-spiced.md
    - montar-funil.md
    - plano-trafego.md
    - estrategia-retencao.md
    - roi-analysis.md
    - montar-time-receita.md
    # v2.0.0 — novas tasks (absorcao de Dara e Executor + gate gerencial):
    - dr-pitch.md                        # pitch + diagnostico express + proposta (ex-Dara)
    - dr-pop-create.md                   # POPs + artefatos padronizados (ex-Executor)
    - v4-integration.md                  # quality gate Fabio (G3 — valida 5 criterios V4)

  workflows:
    - wf-diagnostico-pipeline.yaml
    - wf-destrava-receita.yaml
    - wf-growth-sprint.yaml

  checklists:
    # v1.1.0: alinhados com arquivos reais em /checklists/
    - diagnostico-checklist.md
    - oferta-dr-checklist.md
    - funil-checklist.md
    - ciclo-90d-checklist.md
    - growth-audit-checklist.md

  templates:
    # v1.1.0: alinhados com arquivos reais em /templates/
    - proposta-dr-tmpl.md
    - ciclo-90d-tmpl.md
    - diagnostico-travas-tmpl.md
    - growth-report-tmpl.md

  data:
    - travas-reference.yaml
    - produtos-dr.yaml
    - frameworks-v4.yaml

config:
  extends: extend

dependencies:
  node: []
  python: []
  squads:
    - time-de-negocios  # Handoff para negociacao complexa

philosophy:
  core_mantra: "Destravar o gargalo certo no momento certo e a diferenca entre crescer 20% e 10x."
  metodologia: "V4 Company — 4 Pilares, 8 Travas, ciclos de 90 dias, TOC aplicada a receita"
  documento_mae: "FABRICA-DE-RECEITA.md"
  governanca:
    principio_1: "Documento-mae (FABRICA-DE-RECEITA.md) e referencia unica — toda mudanca comeca la"
    principio_2: "Todo agent vinculado a pelo menos uma task/workflow (sem orfaos)"
    principio_3: "Fabio (fabrica-de-receita-master) e o quality gate gerencial em todos os workflows"
  pilares_v4:
    trafego: "Atrair o publico certo com custo otimizado (CAC, ROAS, CPL) — cobre T1-T2"
    engajamento: "Converter atencao em intencao — conteudo, comunidade, nurture — cobre T3-T4-T5"
    conversao: "Transformar intencao em receita — funil, oferta, vendas — cobre T6-T7"
    retencao: "Maximizar LTV — CS, churn, expansao, referral — cobre T8"
  oito_travas:
    # Taxonomia oficial V4 Company (fonte: docs/produtos/destrava-receita)
    # v1.1.0: corrigida taxonomia que divergia do doc oficial (v1.0 usava nomes nao-oficiais)
    T1: "Cegueira — nao sabe quem e o mercado-alvo nem onde encontra-lo (ICP, target)"
    T2: "Exposicao — mercado nao ve a solucao ou ve pouco (brand, alcance, presenca digital)"
    T3: "Atencao — leads recebem tanto conteudo que nao focam (copy, hook, ruido)"
    T4: "Interesse — leads nao veem valor unico ou sao indiferentes (diferenciacao, storytelling)"
    T5: "Qualificacao — leads nao passam pelo funil de qualificacao (SPICED, SDR, filtro)"
    T6: "Compromisso — prospect nao se posiciona como buyer na negociacao (demo, objecao)"
    T7: "Decisao — buyer nao assina o contrato (closing, timeline, urgencia)"
    T8: "Retencao — cliente cancela, nao expande, churn alto (CS, onboarding, expansao, LTV)"
  produtos_dr:
    dr_x: "Destrava Receita X — 45 dias, R$20-40k, diagnostico + plano + sprint inicial"
    dr_o: "Destrava Receita O (Operacional) — 12 meses, R$50k/ano, acompanhamento mensal"
    dr_t: "Destrava Receita T (Times) — 12 meses, R$150k/ano, treinamento + implantacao"
    dr_e: "Destrava Receita E (Enterprise) — 12 meses, R$350k/ano, dedicacao exclusiva"
  framework_step:
    S: "Situacao — onde o cliente esta hoje"
    T: "Trava — o que esta impedindo crescimento"
    E: "Estrategia — o caminho para destravar"
    P: "Plano — as acoes concretas (ciclo 90 dias)"
  ciclo_90_dias:
    mes_1: "Diagnostico profundo + quick wins (gerar credibilidade e caixa rapido)"
    mes_2: "Implantacao das 3 alavancas prioritarias do ciclo"
    mes_3: "Mensuracao, ajuste e planejamento do proximo ciclo"
