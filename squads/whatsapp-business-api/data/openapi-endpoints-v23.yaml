    remove: { method: DELETE, path: "/{WABA-ID}/assigned_users" }

  activities:
    method: GET
    path: "/{WABA-ID}/activities"
    description: "WABA audit trail — filter by activity_type, since, until"
    activity_types: ["ACCOUNT_CREATED", "ACCOUNT_UPDATED", "ACCOUNT_DELETED",
      "PHONE_NUMBER_ADDED", "PHONE_NUMBER_REMOVED", "PHONE_NUMBER_VERIFIED",
      "USER_ADDED", "USER_REMOVED", "USER_ROLE_CHANGED",
      "PERMISSION_GRANTED", "PERMISSION_REVOKED",
      "TEMPLATE_CREATED", "TEMPLATE_UPDATED", "TEMPLATE_DELETED",
      "WEBHOOK_CONFIGURED", "API_ACCESS_GRANTED", "API_ACCESS_REVOKED",
      "BILLING_UPDATED", "COMPLIANCE_ACTION", "SECURITY_EVENT"]

  schedules:
    list: { method: GET, path: "/{WABA-ID}/schedules" }
    create: { method: POST, path: "/{WABA-ID}/schedules" }
    types: ["BUSINESS_HOURS", "AUTOMATED_RESPONSE", "MESSAGE_CAMPAIGN", "MAINTENANCE_WINDOW", "CUSTOM"]

  solutions:
    method: GET
    path: "/{WABA-ID}/solutions"
    description: "List Multi-Partner Solutions for a WABA"

  permissions: ["MANAGE", "DEVELOP", "MANAGE_TEMPLATES", "MANAGE_PHONE", "VIEW_COST",
    "MANAGE_EXTENSIONS", "VIEW_PHONE_ASSETS", "MANAGE_PHONE_ASSETS", "VIEW_TEMPLATES",
    "VIEW_INSIGHTS", "RECEIVE_INCOMING_MESSAGES", "MANAGE_BILLING", "MANAGE_USERS",
    "MESSAGING", "FULL_CONTROL"]

# ═══════════════════════════════════════════════════════════════
# MULTI-PARTNER SOLUTIONS (NEW)
# ═══════════════════════════════════════════════════════════════
multi_partner:
  create_solution:
    method: POST
    path: "/{Application-ID}/whatsapp_business_solution"
    description: "Create Multi-Partner Solution"
    body: { owner_permissions: ["MESSAGING"], partner_app_id: "string", partner_permissions: [], solution_name: "string" }
    rule: "Exactly ONE side must have MESSAGING permission"

  list_solutions:
    method: GET
    path: "/{Application-ID}/whatsapp_business_solutions"
    filter: { role: ["OWNER", "PARTNER"] }

  get_solution:
    method: GET
    path: "/{Solution-ID}"
    status_values: ["DRAFT", "INITIATED", "ACTIVE", "REJECTED", "DEACTIVATED"]

  get_access_token:
    method: GET
    path: "/{Solution-ID}/access_token"
    description: "Get solution-scoped access token"

  accept: { method: POST, path: "/{Solution-ID}/accept" }
  reject: { method: POST, path: "/{Solution-ID}/reject" }
  send_deactivation: { method: POST, path: "/{Solution-ID}/send_deactivation_request" }
  accept_deactivation: { method: POST, path: "/{Solution-ID}/accept_deactivation_request" }
  reject_deactivation: { method: POST, path: "/{Solution-ID}/reject_deactivation_request" }

