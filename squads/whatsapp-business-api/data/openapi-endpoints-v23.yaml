    description: "Create template (including OTP with copy-code, flow buttons)"

  delete_template:
    method: DELETE
    path: "/{WABA-ID}/message_templates"
    description: "Delete template by name"

  get_template:
    method: GET
    path: "/{TEMPLATE_ID}"
    description: "Get template by ID (includes previous_category field)"

  edit_template:
    method: POST
    path: "/{TEMPLATE_ID}"
    description: "Edit an existing template"

  new_button_types:
    - type: "FLOW"
      references: ["flow_id", "flow_name", "flow_json (inline — NEW)"]
    - type: "MPM"
      description: "Multi-Product Message button — triggers product picker"
    - type: "OTP/COPY_CODE"
      description: "Authentication with copy-code button"
    - type: "OTP/ONE_TAP"
      description: "Authentication with one-tap autofill"
      android_fields: ["package_name", "signature_hash"]
    - type: "LOCATION"
      description: "Location header format"

  template_status_values: ["APPROVED", "PENDING", "REJECTED", "DISABLED"]

