# ═══════════════════════════════════════════════════════════════
# MESSAGING (Core)
# ═══════════════════════════════════════════════════════════════
messaging:
  send_message:
    method: POST
    path: "/{Phone-Number-ID}/messages"
    description: "Send any WhatsApp message (text, template, media, interactive, location, contacts, reaction, sticker)"
    recipient_type: ["individual", "group"]
    body_required: ["messaging_product", "to", "type"]

  send_marketing_message:
    method: POST
    path: "/{Phone-Number-ID}/marketing_messages"
    description: "Send marketing template with product policy controls"
    new_fields:
      product_policy: ["CLOUD_API_FALLBACK", "STRICT"]
      message_activity_sharing: "boolean — control activity sharing with Meta"
    response_status: ["accepted", "held_for_quality_assessment", "paused"]

  send_encrypted_message:
    method: POST
    path: "/{Phone-Number-ID}/messages_encrypted"
    description: "Send end-to-end encrypted message (JWE format, MM Lite path)"
    encryption: "JWE — A128GCM, A256GCM, A128CBC-HS256, A192CBC-HS384, A256CBC-HS512"
    requires: "2048-bit RSA public key configured via settings"

  mark_read:
    method: POST
    path: "/{Phone-Number-ID}/messages"
    description: "Mark message as read"
    body: { status: "read", message_id: "{wamid}" }

# ═══════════════════════════════════════════════════════════════
# CALLS (NEW in v23.0)
# ═══════════════════════════════════════════════════════════════
calls:
  check_permission:
    method: GET
    path: "/{Phone-Number-ID}/call_permissions"
    description: "Check if business has permission to call a WhatsApp user"
    params: { user_wa_id: "required — target user WhatsApp ID" }
    response:
      permission_status: ["granted", "pending", "denied", "expired"]
      expiration_time: "unix timestamp"
      actions: ["start_call", "send_call_permission_request"]
    rate_limit_error: "code 4, subcode 2390008"

  manage_call:
    method: POST
    path: "/{Phone-Number-ID}/calls"
    description: "Initiate, accept, reject, or terminate a voice call via WebRTC SDP"
    actions:
      connect: "Initiate outbound call (requires SDP offer)"
      pre_accept: "Prepare to accept incoming call"
      accept: "Accept incoming call (requires SDP answer)"
      reject: "Reject incoming call"
      terminate: "End active call (requires call_id)"
    sdp: "RFC 8866 compliant — OPUS 48kHz, G722, PCMU, PCMA, UDP/TLS/RTP/SAVPF"
    callback: "biz_opaque_callback_data (max 512 chars)"
    prerequisite: "Cloud API Calling must be enabled for the phone number"
    error_code: "138006 — missing call permission from user"

# ═══════════════════════════════════════════════════════════════
# GROUPS (NEW — Business-Initiated Groups)
# ═══════════════════════════════════════════════════════════════
groups:
  create_group:
    method: POST
    path: "/{Phone-Number-ID}/groups"
    description: "Create a new WhatsApp group"
    params:
      subject: "max 128 chars"
      description: "max 2048 chars"
      join_approval_mode: ["approval_required", "auto_approve"]

  list_groups:
    method: GET
    path: "/{Phone-Number-ID}/groups"
    description: "List active groups for a business phone number"

  get_group:
    method: GET
    path: "/{group_id}"
    description: "Get group metadata (subject, description, participants, join_approval_mode)"

  update_group:
    method: POST
    path: "/{group_id}"
    description: "Update group settings (subject, description, photo)"

  delete_group:
    method: DELETE
    path: "/{group_id}"
    description: "Delete group and remove all participants"

  create_invite_link:
    method: POST
    path: "/{group_id}/invite_link"
    description: "Create group invite link (chat.whatsapp.com/LINK_ID)"

  delete_invite_link:
    method: DELETE
    path: "/{group_id}/invite_link"
    description: "Revoke group invite link"

  list_join_requests:
    method: GET
    path: "/{group_id}/join_requests"
    description: "List pending join requests"

  approve_join_requests:
    method: POST
    path: "/{group_id}/join_requests"
    description: "Approve one or more join requests"

  reject_join_requests:
    method: DELETE
    path: "/{group_id}/join_requests"
    description: "Reject one or more join requests"

  add_participants:
    method: POST
    path: "/{group_id}/participants"
    description: "Add up to 8 participants per call"

  remove_participants:
    method: DELETE
    path: "/{group_id}/participants"
    description: "Remove up to 8 participants per call"

