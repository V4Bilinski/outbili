# OpenAPI Schemas — WhatsApp Business Messaging API v23.0
# Source: github.com/facebook/openapi — components/schemas
# Extracted: 2026-04-09

metadata:
  source: "github.com/facebook/openapi"
  spec_version: "v23.0"
  total_schemas: "100+"

# ═══════════════════════════════════════════════════════════════
# MESSAGE TYPES (Outgoing)
# ═══════════════════════════════════════════════════════════════
message_types:
  discriminator: "type"
  base_required: ["messaging_product", "recipient_type", "to", "type"]
  recipient_type: ["individual", "group"]

  types:
    text:
      body_key: "text.body"
      optional: ["text.preview_url"]

    image:
      body_key: "image"
      media: { id: "or link", caption: "max 1024 chars" }

    video:
      body_key: "video"
      media: { id: "or link", caption: "max 1024 chars" }

    audio:
      body_key: "audio"
      media: { id: "or link" }

    document:
      body_key: "document"
      media: { id: "or link", caption: "optional", filename: "optional" }

    sticker:
      body_key: "sticker"
      media: { id: "or link" }

    location:
      body_key: "location"
      required: ["latitude", "longitude"]
      optional: ["name", "address"]

    contacts:
      body_key: "contacts"
      max_items: 5
      fields: ["addresses", "birthday", "emails", "name", "org", "phones", "urls"]

    reaction:
      body_key: "reaction"
      required: ["emoji", "message_id"]

    template:
      body_key: "template"
      required: ["name", "language"]
      optional: ["components"]

    interactive:
      body_key: "interactive"
      required: ["type", "action"]
      types: ["button", "list", "product", "product_list", "catalog_message", "flow", "call_permission_request"]

# ═══════════════════════════════════════════════════════════════
# INTERACTIVE TYPES (Detail)
# ═══════════════════════════════════════════════════════════════
interactive:
  button:
    action: { buttons: "array 1-3, each {type: reply, reply: {id, title(max 20)}}" }
    optional: ["header", "body", "footer"]

  list:
    action: { button: "max 20 chars", sections: "array 1-10" }
    section: { title: "max 24 chars", rows: "array max 10, each {id(200), title(24), description(72)}" }

  product:
    action: { catalog_id: "string", product_retailer_id: "string" }

  product_list:
    action: { catalog_id: "string", sections: "array 1-30 products per section" }

  catalog_message:
    action: { name: "catalog_message", parameters: { thumbnail_product_retailer_id: "string" } }

  flow:
    action:
      name: "flow"
      parameters:
        flow_message_version: "3"
        flow_cta: "string"
        flow_id: "OR flow_name"
        mode: "draft|published"
        flow_token: "string"
        flow_action: ["navigate", "data_exchange"]
        flow_action_payload: { screen: "string", data: {} }

  call_permission_request:
    action: { name: "call_permission_request" }
    description: "NEW — send interactive call permission request to user"

# ═══════════════════════════════════════════════════════════════
# TEMPLATE COMPONENTS
# ═══════════════════════════════════════════════════════════════
template_components:
  header:
    formats: ["TEXT", "IMAGE", "VIDEO", "DOCUMENT", "LOCATION"]
    text_max: 60
    variables: 1

  body:
    text_max: 1024
    variables: "multiple"
    parameter_types: ["text", "currency", "date_time", "image", "video", "document"]

  footer:
    text_max: 60
    variables: 0

  buttons:
    types:
      quick_reply: { max: 10, label_max: 25, has: "payload" }
      url: { max: 2, label_max: 25, has: "dynamic suffix text" }
      phone_number: { max: 1, label_max: 25 }
      copy_code: { max: 1, label_max: 25 }
      flow: { max: 1, label_max: 25, references: ["flow_id", "flow_name", "flow_json"] }
      mpm: { description: "Multi-Product Message — triggers product picker" }
      otp_copy_code: { description: "Authentication copy-code button" }
      otp_one_tap:
        description: "Authentication one-tap autofill"
        android_fields: ["package_name", "signature_hash"]

  currency_parameter:
    fields: { fallback_value: "string", code: "ISO 4217", amount_1000: "int (100000 = $100.00)" }

  datetime_parameter:
    fields: { fallback_value: "string" }

# ═══════════════════════════════════════════════════════════════
# WEBHOOK PAYLOAD STRUCTURE
# ═══════════════════════════════════════════════════════════════
webhook:
  structure: "object → entry[] → changes[] → value"
  top_level:
    object: "whatsapp_business_account"
    entry: { id: "WABA ID", changes: [] }

  change_fields:
    - messages
    - group_lifecycle_update
    - group_settings_update
    - group_participant_update
    - calls

  value_types:
    messages:
      fields: ["messaging_product", "metadata", "contacts", "messages"]
      message_types: ["text", "image", "video", "audio", "document", "sticker",
        "location", "contacts", "reaction", "button", "interactive", "order",
        "system", "unsupported"]

    statuses:
      fields: ["messaging_product", "metadata", "statuses"]
      status_values: ["sent", "delivered", "read", "failed"]
      conversation:
        id: "string"
        expiration_timestamp: "unix"
        origin_type: ["marketing", "utility", "authentication", "service", "referral_conversion"]
      pricing:
        billable: "boolean"
        pricing_model: ["CBP", "PMP"]
        category: "string"

    groups:
      event_types: ["group_create", "group_delete", "group_settings_update",
        "group_add_participants", "group_remove_participants"]

  incoming_message_extras:
    context: { from: "string", id: "wamid", referred_product: { catalog_id: "string", product_retailer_id: "string" } }
    referral:
      description: "Click-to-WhatsApp ad attribution"
      fields: ["source_url", "source_id", "source_type(ad|post)", "body", "headline",
        "media_type(image|video)", "ctwa_clid", "welcome_message"]

# ═══════════════════════════════════════════════════════════════
# PHONE NUMBER ENUMS
# ═══════════════════════════════════════════════════════════════
phone_number_enums:
  quality_rating: ["GREEN", "YELLOW", "RED", "NA", "UNKNOWN"]

  messaging_limit_tier: ["TIER_50", "TIER_250", "TIER_1K", "TIER_10K", "TIER_100K", "TIER_UNLIMITED"]

  status: ["PENDING", "LINKED", "UNLINKED", "DELETED", "MIGRATED", "BANNED", "RESTRICTED"]

  code_verification_status: ["VERIFIED", "NOT_VERIFIED"]

  name_status: ["APPROVED", "AVAILABLE_WITHOUT_REVIEW", "DECLINED", "EXPIRED", "PENDING_REVIEW", "NONE"]

  unified_cert_status: ["APPROVED", "NAME_PENDING_REVIEW", "NAME_NOT_APPROVED", "ACCOUNT_REVIEW_NOT_STARTED", "LIMITED_ACCESS"]

  host_platform: ["CLOUD_API", "ON_PREMISE", "NOT_APPLICABLE"]

  account_mode: ["LIVE", "SANDBOX"]

# ═══════════════════════════════════════════════════════════════
# WABA ENUMS
# ═══════════════════════════════════════════════════════════════
waba_enums:
  account_review_status: ["APPROVED", "PENDING", "REJECTED", "RESTRICTED", "LIMIT_REACHED"]
  ownership_type: ["SELF_OWNED", "CLIENT_OWNED", "AGENCY_OWNED"]
  business_verification_status: ["VERIFIED", "UNVERIFIED", "PENDING", "REJECTED"]

# ═══════════════════════════════════════════════════════════════
# CALLS SCHEMAS
# ═══════════════════════════════════════════════════════════════
calls:
  permission_status: ["granted", "pending", "denied", "expired"]
  call_actions: ["connect", "pre_accept", "accept", "reject", "terminate"]
  sdp_type: ["offer", "answer"]
  transport: "WebRTC UDP/TLS/RTP/SAVPF"
  codecs: ["OPUS 48kHz", "G722", "PCMU", "PCMA"]
  callback_max: 512

# ═══════════════════════════════════════════════════════════════
# ERROR STRUCTURE
# ═══════════════════════════════════════════════════════════════
error:
  structure:
    required: ["message", "type", "code"]
    optional: ["error_subcode", "fbtrace_id", "is_transient", "error_user_title", "error_user_msg"]
  types: ["OAuthException", "GraphMethodException"]
  webhook_error_extras: ["href", "error_data.details"]

# ═══════════════════════════════════════════════════════════════
# MULTI-PARTNER ENUMS
# ═══════════════════════════════════════════════════════════════
multi_partner:
  solution_status: ["DRAFT", "INITIATED", "ACTIVE", "REJECTED", "DEACTIVATED"]
  pending_request_status: ["PENDING_ACTIVATION", "PENDING_DEACTIVATION", "NONE"]
  configurable_permission: ["MESSAGING"]

# ═══════════════════════════════════════════════════════════════
# SCHEDULE ENUMS
# ═══════════════════════════════════════════════════════════════
schedules:
  status: ["ACTIVE", "INACTIVE", "PAUSED", "EXPIRED", "DRAFT"]
  type: ["BUSINESS_HOURS", "AUTOMATED_RESPONSE", "MESSAGE_CAMPAIGN", "MAINTENANCE_WINDOW", "CUSTOM"]
  recurrence_frequency: ["DAILY", "WEEKLY", "MONTHLY", "YEARLY"]
  days: ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"]

# ═══════════════════════════════════════════════════════════════
# MESSAGE DELIVERY STATUS
# ═══════════════════════════════════════════════════════════════
message_history:
  delivery_status: ["SENT", "DELIVERED", "READ", "FAILED", "DELETED"]
  webhook_update_state: ["PENDING", "DELIVERED", "FAILED", "RETRYING"]
