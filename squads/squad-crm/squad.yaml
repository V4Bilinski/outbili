philosophy:
  core_mantra: "Controle total com inteligência em cada dado — do lead ao lucro."
  pilares_operacionais:
    - name: Receita & Crescimento
      description: "Pipeline de vendas otimizado com forecasting e deal-to-squad bridge"
      inspiracao: "Pipedrive (UX) + HubSpot (automação) + Kommo (WhatsApp)"
    - name: Aquisição de Clientes
      description: "Lead scoring, pré-vendas estruturado, conversão mensurável"
      inspiracao: "HubSpot (lead scoring) + Pipedrive (activity-based) + RD Station (Brasil)"
    - name: Customer Success
      description: "Health score, NPS, alertas de churn, playbooks de retenção"
      inspiracao: "HubSpot (CS Workspace) + Salesforce (churn prediction)"
    - name: Financeiro & RevOps
      description: "MRR/ARR, ROI por cliente, lucratividade, forecasting"
      inspiracao: "Salesforce (revenue) + Bitrix24 (invoicing) + Ekyte (ROI por cliente)"
    - name: Produção & Demandas
      description: "Gestão de squads, workload, sprints, aprovações de criativos"
      inspiracao: "ClickUp (hierarquia) + Ekyte (produção agência) + Monday (workload)"
    - name: Pessoas & Performance
      description: "OKRs, DISC, performance reviews, capacity planning"
      inspiracao: "Monday (HR) + ClickUp (goals) + Bitrix24 (directory)"
    - name: Inteligência de Dados
      description: "Dashboards cross-entity, KPIs, ranking, drill-down"
      inspiracao: "Salesforce (analytics) + HubSpot (dashboards)"
  ciclo_completo:
    etapas:
      - "PRÉ-VENDAS: Lead scoring + qualificação + WhatsApp"
      - "REUNIÃO: Activity-based selling + proposta automatizada"
      - "FECHAMENTO: Contrato + assinatura + distribuição"
      - "DISTRIBUIÇÃO: Deal-to-Squad bridge automático"
      - "PRODUÇÃO: Demandas + sprints + workload + aprovação"
      - "CS: Health score + NPS + alertas + retenção"
      - "MONETIZAÇÃO: Upsell + expansion + renewal tracking"
      - "FINANCEIRO: MRR/ARR + ROI + margem + forecast"
  diferenciais_brabissimo:
    - "Vertical para franquias de marketing digital — nenhuma plataforma atende 100%"
    - "Deal-to-Squad bridge nativo — fechamento vira distribuição automática"
    - "ROI por cliente em tempo real — custo operacional vs receita"
    - "Health Score que considera produção — não apenas tickets e NPS"
    - "Ranking NRR integrado — crescimento de receita por cliente"
    - "Pessoas + Produção linkados — workload conectado à performance"
    - "Financeiro operacional — lucratividade por operação em tempo real"
