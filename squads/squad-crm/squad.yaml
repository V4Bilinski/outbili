name: squad-crm
version: 1.0.0
description: |
  Squad de CRM & Business Operations para gestão completa da V4 Bilinski & Co.
  Especializado em todo o ciclo de vida do cliente e operações de negócio:
  Pré-vendas → Reunião → Fechamento → Distribuição → Produção → CS → Monetização → Financeiro.

  Baseado em benchmarking de 13 plataformas (ClickUp, HubSpot, Salesforce, Pipedrive, Monday,
  Ekyte, Pipefy, Bitrix24, Kommo, RD Station, Asana, Trello, Notion) com as melhores práticas
  de cada uma incorporadas nos agentes especializados.

  Missão: Tornar o Brabissimo o núcleo de inteligência operacional da V4 Bilinski & Co,
  controlando todas as áreas com enriquecimento de dados e alta performance.

author: Luiz Henrique
license: MIT
slashPrefix: crm

aios:
  minVersion: "2.1.0"
  type: squad

tags:
  - crm
  - business-operations
  - sales-pipeline
  - customer-success
  - revenue-operations
  - people-performance
  - project-management
  - financial-control
  - production-management
  - automation
  - analytics
  - v4-bilinski
  - nucleo-inteligencia

